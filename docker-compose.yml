services:
  cursor2api:
    image: ghcr.io/astroqore/cursor2api:latest
    # Falls back to building from source if the image can't be pulled.
    build: .
    container_name: cursor2api
    restart: unless-stopped
    ports:
      - "8790:8790"
    volumes:
      # accounts.json lives here. Create it first:
      #   docker compose run --rm cursor2api node scripts/login.mjs --out /data/accounts.json
      - ./data:/data
    environment:
      # Require callers to send `Authorization: Bearer <key>`. Set this before
      # exposing the port to anything but localhost.
      # - CURSOR_DIRECT_API_KEY=sk-your-secret

      # Model names are served as `cursor-<upstream id>`; set to "" for raw ids.
      - CURSOR_DIRECT_MODEL_PREFIX=cursor-

      # Shell, Read, Grep, Ls, and Pi tools. The gateway rewrites them onto the
      # caller's tool name and argument keys (Claude, Pi, Codex, Grok Build).
      # edit_tool_call is omitted: its exec has no old/new text. `*` keeps every native.
      - CURSOR_ALLOWED_NATIVE_TOOLS=mcp_tool_call,get_mcp_tools_tool_call,shell_tool_call,read_tool_call,grep_tool_call,ls_tool_call,pi_bash_tool_call,pi_read_tool_call,pi_edit_tool_call,pi_write_tool_call,pi_grep_tool_call,pi_find_tool_call,pi_ls_tool_call

      # Route upstream traffic through a SOCKS5 proxy if your host needs one.
      # - CURSOR_DIRECT_PROXY_URL=socks5://host.docker.internal:1080

      # Bump this when Cursor version-gates older clients.
      # - CURSOR_DIRECT_CLIENT_VERSION=cli-2026.08.11-e8db854
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
